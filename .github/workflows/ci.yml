name: CI

on:
  push:
  pull_request:

jobs:
  generator:
    name: Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./internal/...
      # Fails if a generated file was hand-edited, or if the spec changed
      # without the output being regenerated and committed.
      - run: go run ./cmd/simplefin-gen verify

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
        working-directory: sdk/go
      - run: go test ./...
        working-directory: sdk/go

  node-sdk:
    name: Node SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci || npm install
        working-directory: sdk/node
      # Build first: the tests import from dist/, which is what a consumer
      # installs, so typechecking them requires the build output to exist.
      - run: npm run build
        working-directory: sdk/node
      # Typechecks src and tests under strict mode.
      - run: npx tsc -p tsconfig.json
        working-directory: sdk/node
      - run: npm test
        working-directory: sdk/node

  cross-language:
    name: Cross-language equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: ./scripts/cross-language-check.sh
